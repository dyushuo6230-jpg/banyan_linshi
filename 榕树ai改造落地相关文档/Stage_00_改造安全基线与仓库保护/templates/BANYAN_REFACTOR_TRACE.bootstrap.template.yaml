# Bootstrap template until Stage 03 freezes the final trace schema.
schema_version: "bootstrap-v1"
charter_version: "1.9.1"

bootstrap:
  bootstrap_only: true
  refactor_control_root: null
  run_id: null
  future_canonical_path: ".banyan/migrations/BANYAN_REFACTOR_TRACE.yaml"
  lineage_required: true
  dual_writable_truth_forbidden: true
  canonical_writable_truth_active: false

requirements:
