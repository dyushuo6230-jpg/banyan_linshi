- id: F4-D42
  status: HUMAN_APPROVED
  decision: Functional Role uses dynamic capability composition, not an internal pipeline.
- id: F4-D43
  status: HUMAN_APPROVED
  decision: Core Functional Role catalog baseline frozen.
- id: F4-D44
  status: HUMAN_APPROVED
  decision: Skill catalog architecture/qualification/scope boundary frozen; domain
