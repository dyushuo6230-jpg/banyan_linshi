- id: F4-D45
  status: HUMAN_APPROVED
  decision: Adaptive Workflow Graph/Node/Resolution/Handoff/Validation semantics +
    six quality guardrails frozen.
- id: F4-D46
  status: HUMAN_APPROVED
  decision: One Graph Runtime with Orchestration Kernel, Goal-Oriented Families, Reusable
    Subworkflows.
- id: F4-D47
  status: HUMAN_APPROVED
  decision: Semantic Design Coverage extends beyond Role/Capability/Skill/Workflow;
