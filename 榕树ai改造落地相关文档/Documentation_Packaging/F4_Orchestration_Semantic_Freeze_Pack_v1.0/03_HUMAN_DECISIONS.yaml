cross_stage_gates:
- id: CROSS-STAGE-GATE-01
  status: HUMAN_APPROVED
  name: Banyan Semantic Coverage Before Full Legacy Migration
  rule: Full Legacy Semantic Migration / Authority Cutover / Canonical Rewrite / Legacy
    Retirement are forbidden until required semantic domains reach Architecture Freeze
    or an explicitly approved equivalent owner-stage gate.
  required_domains:
  - Role
  - Capability
  - Skill
  - Workflow
  - Policy
  - State Model
  - Decision Protocol
  - Template / Output Contract
  - Provider Contract
  - Engineering Standard
  - Context
  - Evidence / Trace
  - Binding / Assignment
  - Permission / Authority
  - Validation / Acceptance
  - Compatibility / Migration
  required_zero_conditions:
  - UNROUTED_HIGH_VALUE_SEMANTIC
  - SEMANTIC_OWNER_GAP
  - UNRESOLVED_HIGH_IMPACT_TYPE_MAPPING
  - SILENT_SEMANTIC_DROP
