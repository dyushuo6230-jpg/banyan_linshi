stage_exit_gates:
  RP1:
  - 43/43 shadow materialized
  - semantic equivalence with R1 registry
  - self-describing contract satisfied
  - 0 unauthorized semantics
  - 0 dangling refs introduced
  - 0 .banyan changes
  - R0/R1 authority remains intact
  - PLAN_CONFORMANCE_CHECK=PASS
  RP2:
  - artifact files become sole Artifact Semantic Source
  - migration_artifacts.yaml reduced/reframed to migration lineage/index role without duplicate semantic body
  - loader/list/show/validate/refs work
  - wheel/package includes artifacts
  - clean-room artifact discovery passes
  - runtime_dependency_on_v3_1=0
  - DUPLICATE_AUTHORITY=0
  - R0 self-containment revalidated
  - PLAN_CONFORMANCE_CHECK=PASS
  RP5:
  - init/adopt/migrate/reconcile are distinct typed modes
  - safe automatic binding only
  - ambiguous/high-impact binding => NEEDS_INPUT
  - structured result returned
  - existing .banyan never reinitialized
  - rollback/acceptance evidence present
  RP6:
  - Guided setup consumes same Runtime API
  - no UI-owned permission/init/canonical/git engine
  - remaining bindings/configuration are explainable and typed
  - existing Banyan shows reconcile/repair/upgrade surfaces
  RP9:
  - Reference project reconciled without deleting .banyan
  - legacy retirement only after migration completeness + zero runtime dependency
  - rollback rehearsal passed
  - no valuable legacy capability unmapped
