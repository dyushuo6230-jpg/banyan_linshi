project_entry_modes:
  init:
    when: new project / no existing Banyan instance
    effect: create new Project Instance from inspected project facts
    must_not: treat an existing Banyan instance as new
  adopt:
    when: existing project first joins Banyan without governed legacy migration requirement
    effect: preserve project layout, discover/map, create .banyan, bind only confirmed values
    must_not: move canonical sources or rewrite project history
  migrate:
    when: existing project has an existing governance system that must be migrated into Banyan
    effect: inventory -> semantic mapping -> compatibility -> migration plan -> apply -> validate -> rollback evidence
    must_not: delete legacy before no-loss and zero-dependency proof
  reconcile:
    when: project already has .banyan
    effect: read existing instance -> diff framework/contracts/bindings -> controlled migration -> validate -> result
    must_not: delete .banyan and re-init
  upgrade:
    role: RECONCILE_SUBMODE
    mapping: reconcile(mode=UPGRADE_FRAMEWORK)
    not_a_fifth_top_level_entry: true
guided_webui:
  owner_stage: RP6
  trigger: after init/adopt/migrate/reconcile returns structured result and runtime says WebUI launch is available
  runtime_api_only: true
  required_surfaces:
  - Project Setup
  - Project Identity
  - Framework Version
  - Source Mapping
  - Provider Binding
  - Workflow Binding
  - Skill Binding
  - Overlays
  - Variables
  - Git Identity Status
  - Validation
  - Migration Status
  existing_instance_surfaces:
  - Re-scan
  - Repair
  - Upgrade Framework
  - Migration Status
  - Rebuild Index
  - Drift Check
  forbidden:
  - second permission engine
  - second initialization engine
  - second canonical truth
  - direct Git mutation engine
  - secret body display
misconstruction_cleanup_protocol:
  required_at_start_of_every_rp: true
  classification:
  - ACCEPTED_BASELINE
  - PLANNED_TARGET
  - CONFIRMED_MISCONSTRUCTION
  - OBSOLETE_AFTER_MIGRATION
  - HISTORICAL_EVIDENCE
  - AMBIGUOUS
  delete_only_if_all:
  - classification is CONFIRMED_MISCONSTRUCTION or OBSOLETE_AFTER_MIGRATION
  - no runtime/package/registry/reference dependency remains
  - no accepted migration lineage or rollback evidence requires the file
  - deletion is inside current RP write scope
  - PLAN_CONFORMANCE_CHECK records the deletion and evidence
  ambiguous_action: STOP_AFFECTED_DELETE_AND_ASK_USER
  legacy_delete_blocks:
  - MISSING_MIGRATION
  - PARTIALLY_MIGRATED
  - LEGACY_SOURCE_UNVERIFIED
  - runtime_dependency_on_v3_1 != 0
  current_known_classification:
    banyan-framework/src/banyan/contracts/data/migration_artifacts.yaml: ACCEPTED_BASELINE_KEEP_UNTIL_RP2_CONTROLLED_CUTOVER
    .banyan/**: ACCEPTED_PILOT_BASELINE_KEEP_RECONCILE_NOT_REINIT
    banyan-framework/docs/user-guide/**: UNACCEPTED_DOCUMENTATION_OUTPUT_KEEP_FOR_LATER_RP10_REVIEW_NOT_DELETE_NOW
    .banyan-refactor/**: HISTORICAL_EVIDENCE_NOT_RUNTIME_AUTHORITY_DO_NOT_DELETE_WITHOUT_RETENTION_DECISION
    prior rebaseline v1 files: SUPERSEDED_PLANNING_OUTPUT_NOT_ACTIVE_AUTHORITY
  confirmed_deletable_files_in_uploaded_snapshot: []
  note: No file in the uploaded current framework/.banyan snapshot can be safely labeled deletable misconstruction from available
    evidence alone. Future RP prechecks must classify concrete candidates; uncertainty requires user confirmation.
