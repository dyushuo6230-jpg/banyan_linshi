candidate_metadata:
  version: "1.1"
  pack_name: F1_Core_Object_Model_Freeze_Pack_v1.1_Candidate
  stage: F1
  lifecycle_state: AWAITING_FINAL_CONSOLIDATED_FREEZE_REVIEW
  human_approved: false
  architecture_freeze_granted: false
  freeze_baseline_established: false
  authorization:
    implementation: NOT_AUTHORIZED
    rp2: NOT_AUTHORIZED
    authority_cutover: NOT_AUTHORIZED
    canonical_replacement: NOT_AUTHORIZED
    final_activation: NOT_AUTHORIZED
    legacy_retirement: NOT_AUTHORIZED
    sqlite_physical_schema: NOT_FROZEN

source_baseline:
  version: "1.0"
  identity_interpretation: SOURCE_BASELINE_REFERENCE_NOT_REVERSIONED
  historical_metadata:
    schema_version: "1.0"
    contract_id: banyan.f1.core_object_model.v1
    status: FROZEN_ARCHITECTURE_CONTRACT
    human_approved: true


first_class_object_families:
  - ARTIFACT
  - PROJECT_INSTANCE
  - ASSIGNMENT
  - BINDING
  - RUNTIME_EXECUTION
  - CONTEXT
  - EVIDENCE_TRACE
  - INFRASTRUCTURE

artifact:
  top_level_kinds:
    - DEFINITION_ARTIFACT
    - PROJECT_ARTIFACT
  subtype_taxonomy_status: DEFERRED_TO_F3

definition_runtime_separation:
  required: true
  examples:
    - "WorkflowDefinition != WorkflowRun"
    - "StateModelDefinition != RuntimeState"
    - "SkillDefinition != SkillInvocation"
    - "DecisionProtocolDefinition != DecisionSession"

project_instance:
  artifact: false
assignment:
  artifact: false
  purpose: SCOPED_RESPONSIBILITY_ALLOCATION
  grants_authority: false
  grants_permission: false
binding:
  artifact: false
  relation_purpose_classification: true
  generic_role_binding_target_status: RETIRED
  generic_skill_binding_target_status: RETIRED
  current_effective_is_derived: true
  temporary_selection_is_durable_rebinding: false
runtime_execution:
  artifact: false
context:
  artifact: false

evidence:
  trace:
    family: EVIDENCE_TRACE
    artifact: false
    authority_granting: false
    latest_record_is_canonical: false
  package:
    family: ARTIFACT
    artifact_kind: PROJECT_ARTIFACT
    purpose: [ACCEPTANCE, REVIEW, RELEASE, ARCHIVE, LONG_TERM_TRACEABILITY]

infrastructure:
  artifact: false
  examples:
    - Registry
    - Loader
    - Manifest
    - SchemaRegistry
    - SQLiteIndex
    - ReferenceGraph
    - Cache

protected_semantic_boundaries:
  - "Capability != Skill"
  - "Role != Permission"
  - "Role != GitIdentity"
  - "SourceRole != CollaborationRole"
  - "StateDomainsRemainSeparate"
  - "Infrastructure != SemanticArtifact"

  - "StableID != Revision != Version != CurrentEffective"
  - "Assignment != Binding != Resolution != RuntimeExecution"
  - "StateConsumer != StateOwner"
future_change_rule:
  silent_reclassification_forbidden: true
  top_level_family_change_requires:
    - IMPACT_ANALYSIS
    - HUMAN_DECISION
    - VERSIONED_F1_CHANGE_PROPOSAL
