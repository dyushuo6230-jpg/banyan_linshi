stage_closure_decisions:
- id: F6-STAGE-C01
  status: HUMAN_APPROVED
  decision: Historical status fields are approval/execution snapshots; Effective Execution Authorization State is resolved
    from current context.
- id: F6-STAGE-C02
  status: HUMAN_APPROVED
  decision: D01～D10 formal Owner Matrix is frozen; earlier broad reference does not override later specialized owner.
- id: F6-STAGE-C03
  status: HUMAN_APPROVED
  decision: Four-Source Reconciliation is historical reference discovery; Material Reconciliation is current input reconciliation;
    neither creates authority.
- id: F6-STAGE-C04
  status: HUMAN_APPROVED
  decision: Governed does not mean manual every time; deterministic policy-resolvable work should automate, while authority/conflict/high-risk
    gates escalate.
- id: F6-STAGE-C05
  status: HUMAN_APPROVED
  decision: D09 explicit trigger is a specialized full-conformance-session gate, not a global automation pattern.
- id: F6-STAGE-C06
  status: HUMAN_APPROVED
  decision: Derived / Effective / Index / Result objects do not become Canonical Authority through repeated consumption.
cross_stage_approved:
- id: CROSS-STAGE-GOVERNANCE-02
  status: HUMAN_APPROVED
  meaning: Cross-rule relationships and conflict/override semantics must be defined before execution; AI must not guess undefined
    relations.
- id: CROSS-STAGE-AUTONOMY-01
  status: HUMAN_APPROVED
  meaning: Bounded autonomous resolution is allowed only inside already-authorized, low-risk, reversible, verifiable, rule-resolved
    alternatives.
