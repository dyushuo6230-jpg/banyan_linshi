schema_version: stage05-v1
sections: [PLANNED_GROUPS, BLOCKED_GROUPS, LEFTOVERS]
leftover_required_fields:
  - item_id
  - path_or_change_ref
  - why_not_included
  - classification
  - risk
  - recommended_next_action
rules:
