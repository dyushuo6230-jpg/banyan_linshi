schema_version: stage14-v1
protection_classes: [NORMAL, CANONICAL, SECRET_METADATA, PROTECTED_CONFIG, GIT_HISTORY, EXTERNAL_SYSTEM, IRREVERSIBLE]
required_fields: [target_stable_id, target_locator, protection_class, source_role, authority, freshness, current_state, impact_ref, secret_classification, rollback_state]
rules:
  unknown_protection_class: NEEDS_INPUT
  canonical_or_protected_authority_unknown: BLOCK
  current_state_unknown_for_write: BLOCK
  secret_metadata_is_not_secret_body_authorization: true

