schema_version: stage14-v1
identity_source: [git_user_name, git_user_email]
required_for_commit: true
validation: [name_present, email_present, ambiguity_check, bind_to_commit_evidence]
missing_or_ambiguous: NEEDS_INPUT
ai_may_modify_identity: false
ai_may_use_author_override: false
ai_may_invent_author: false
auto_alias_merge: false
operator_inference: false
identity_grants_permission_role: false
stage14_observation:
  name_present: true
  email_present: true
  values_recorded: false
  commit_authorized: false

