    source_ref: docs/
    target_role: DOCUMENTATION_REFERENCE
    authority: UNKNOWN
    freshness: UNKNOWN
    migration_action: NONE
secret_policy:
  state: METADATA_ONLY
  body_read: false
  hash_content: false
  copy: false
  preview: false
