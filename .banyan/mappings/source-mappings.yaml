    source_role: LEGACY_PROJECT_ROOT
    source_ref: ./
    target_role: PROJECT_CONTEXT_REFERENCE
    authority: EXISTING_PROJECT_PRESERVE_IN_PLACE
    freshness: CURRENT_AT_CHECKPOINT
    migration_action: NONE
