    - {path: /preflight, name: Preflight, endpoint: /api/preflight}
    - {path: /commit-plan, name: Commit Plan, endpoint: /api/commit/plan}
    - {path: /dry-run-result, name: Dry-run Result, endpoint: /api/commit/dry-run}
    - {path: /trace-audit, name: Trace / Audit, endpoint: "/api/trace?offset=0&limit=50"}
    - {path: /provenance, name: Provenance, endpoint: /api/provenance/UNKNOWN}
    - {path: /provider-bindings, name: Provider Bindings, endpoint: /api/providers}
    - {path: /stage-run, name: Stage / Run, endpoint: "/api/stages?offset=0&limit=25"}
    - {path: /activation-readiness, name: Activation Readiness, endpoint: /api/activation-readiness}
  authority: NONE
  current_project_git_mutation: DISABLED
  help_center:
    path: /help
    state: NOT_IMPLEMENTED

adapters:
  actual_adapters:
    - id: cursor
      implementation: banyan.editor.adapters.CursorAdapter
      request_shape: [request_id, command, arguments, context, evidence_refs]
      state: IMPLEMENTED_VALIDATED
    - id: codex
      implementation: banyan.editor.adapters.CodexAdapter
      request_shape: [id, operation, input, metadata, evidence_refs]
      state: IMPLEMENTED_VALIDATED
    - id: generic-editor
      implementation: banyan.editor.adapters.GenericEditorAdapter
      request_shape: [request_id, action, payload, provenance, evidence_refs]
      state: IMPLEMENTED_VALIDATED
    - id: cursor-pilot
      implementation: banyan.cursor.adapter.CursorPilotAdapter
      state: IMPLEMENTED_PILOT_SPECIFIC
    - id: filesystem
      implementation: banyan.adapters.filesystem.FilesystemAdapter
      state: IMPLEMENTED_INTERNAL
    - id: process
      implementation: banyan.adapters.process.ProcessRunner
      state: IMPLEMENTED_INTERNAL
  editor_gateway: banyan.editor.protocol.AdapterGateway
  supported_editor_actions:
    - runtime_status
    - project_safety
    - preflight
    - commit_plan
    - commit_dry_run
    - trace
    - provenance
  forbidden_editor_actions:
    - git_mutation
    - commit_execute
    - canonical_write
    - protected_write_execute
    - activate
    - identity_write
    - secret_body_read
  adapter_authority:
    owns_permission_policy: false
    owns_canonical_truth: false
    direct_git_mutation: false
    identity_modification: false
    secret_body_access: false

