schema_version: banyan-docs-source-v1
inventory_id: D0-DOCUMENTATION-SOURCE-OF-TRUTH
inventory_date: "2026-09-21"
scope: DOCUMENTATION_FACT_INVENTORY_ONLY
evidence_basis:
  framework_release: v1.10-additive.1
  framework_release_state: RELEASED_AS_ADDITIVE_SUPPLEMENT_NOT_CURRENT
  governance_current_pointer: v1.9.1
  governance_pointer_state: CURRENT_FINAL_FREEZE
  stage20_run_id: stage20-20260921T073758Z
  stage20_result: PASS_STAGE20_DOCUMENTATION_FRAMEWORK_RELEASE_FINAL_HANDOFF_WITH_PROJECT_ACTIVATION_BLOCKED
  runtime_package_version: 0.1.0
  source_precedence:
    - current_implementation_source
    - Stage_20_accepted_evidence
    - earlier_frozen_contracts_referenced_by_Stage_20
    - documentation_packaging_expectations
  interpretation_rules:
    - A frozen contract is recorded separately from an executable implementation.
    - Documentation-planned behavior is not recorded as an implemented capability.
    - Unknown, blocked, pilot, and not-authorized states remain explicit.

runtime:
  language: Python
  root: banyan-framework/src/banyan/runtime
  class: banyan.runtime.api.RuntimeAPI
  architecture_role: policy_and_execution_core
  actual_api:
    - {name: evaluate_action, state: IMPLEMENTED, effect: permission_evaluation}
    - {name: preflight_action, state: IMPLEMENTED, effect: permission_evaluation_alias}
    - {name: preflight_pilot_creation, state: IMPLEMENTED, effect: pilot_scope_evaluation_only}
    - {name: inspect_project, state: IMPLEMENTED, effect: read_only_git_inspection}
    - {name: plan_commit, state: IMPLEMENTED, effect: plan_only}
    - {name: execute_commit, state: IMPLEMENTED, effect: dry_run_or_isolated_fixture_only_under_gates}
    - {name: dry_run_commit, state: IMPLEMENTED, effect: current_project_dry_run_only}
    - {name: query_trace, state: IMPLEMENTED, effect: read_only_paginated_query}
    - {name: emit_audit, state: IMPLEMENTED, effect: append_trace_when_configured}
    - {name: list_provider_bindings, state: IMPLEMENTED, effect: read_only_binding_load}
    - {name: status, state: IMPLEMENTED, effect: read_only_runtime_status}
  execution_boundaries:
    current_project: DRY_RUN_ONLY
    isolated_fixture: AVAILABLE_WITH_GATES
    authorized_project_execution: DISABLED
    canonical_apply: NOT_IMPLEMENTED_AS_RUNTIME_API

cli:
  python_entrypoint: banyan
  control_plane_entrypoints:
    - banyan-control-plane
    - banyan-control
  actual_commands:
    - command: banyan policy validate PATH
      state: IMPLEMENTED
    - command: banyan policy compile PATH
      state: IMPLEMENTED
    - command: banyan policy compile-stage14 PATH
      state: IMPLEMENTED
    - command: banyan runtime preflight REQUEST [--policy PATH]
      state: IMPLEMENTED
    - command: banyan git inspect REPOSITORY
      state: IMPLEMENTED
    - command: banyan commit plan REPOSITORY --classifications PATH [--groups PATH] [--messages PATH]
      state: IMPLEMENTED
    - command: banyan commit execute REPOSITORY --plan PATH [--policy PATH] [--authorization-ref REF] [--trace PATH] (--dry-run | --fixture-root PATH)
      state: IMPLEMENTED_WITH_SAFETY_BOUNDARY
    - command: banyan trace validate PATH
      state: IMPLEMENTED
    - command: banyan trace emit PATH EVENT
      state: IMPLEMENTED
    - command: banyan provider list PATH
      state: IMPLEMENTED
    - command: banyan-control-plane --repository PATH --policy PATH [--host HOST] [--port PORT] [--trace PATH] [--providers PATH] [--provenance PATH] [--stages PATH]
      state: IMPLEMENTED_LEGACY_PYTHON_CONTROL_PLANE_ENTRY
    - command: banyan-control --repository PATH --policy PATH [--host HOST] [--port PORT] [--trace PATH] [--providers PATH] [--provenance PATH] [--stages PATH]
      state: IMPLEMENTED_CURRENT_GO_CONTROL_PLANE_ENTRY

control_plane:
  web_host: GO_GIN_GO_EMBED
  bridge: LOCAL_STDIO
  bridge_target: banyan.control_plane.bridge
  bind_hosts: [127.0.0.1, localhost, "::1"]
  public_bind_allowed: false
  max_body_bytes: 1000000
  runtime_timeout_seconds: 10
  actual_http_api:
    - {method: GET, path: /api/status, operation: status}
    - {method: GET, path: /api/policy, operation: policy_status}
    - {method: GET, path: /api/project-safety, operation: project_safety}
    - {method: POST, path: /api/preflight, operation: preflight}
    - {method: POST, path: /api/commit/plan, operation: commit_plan}
    - {method: POST, path: /api/commit/dry-run, operation: commit_dry_run}
    - {method: GET, path: /api/trace, operation: trace_query}
    - {method: GET, path: "/api/provenance/:id", operation: provenance_query}
    - {method: GET, path: /api/providers, operation: provider_status}
    - {method: GET, path: /api/stages, operation: stage_query}
    - {method: GET, path: /api/activation-readiness, operation: activation_readiness}
    - {method: POST, path: "/api/adapters/:kind", operation: adapter_request}
  forbidden_api_capabilities:
    - current_project_git_mutation
    - canonical_apply
    - protected_write_execution
    - provider_activation
    - project_instance_final_activation

webui:
  framework: ANT_DESIGN_PRO_SIMPLE
  root: banyan-framework/frontend
  host: embedded_in_go_binary
  actual_pages:
